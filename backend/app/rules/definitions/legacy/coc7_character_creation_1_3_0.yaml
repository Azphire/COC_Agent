id: coc7-character-creation
version: 1.3.0
display_name: CoC 第七版角色创建
edition: coc7
enabled: true
verification_status: verified
source_reference:
- filename: 克苏鲁的呼唤第七版规则书1907.pdf
  section: 第四章，PDF页68–69（印刷页67–68）
  notes: 第十六批仅补模组必需的潜行20、投掷20；旧角色未分配这两项时按核实的基础值判定，不改写原角色快照。
- filename: 克苏鲁的呼唤第七版规则书1907.pdf
  section: 第三章 3.1、3.3、3.6、3.7；PDF页24–31、38–40（印刷页23–30、37–39）
  notes: 核对八项属性、年龄调整、幸运、教育增强、HP/MP/SAN/MOV/DB/体格、职业与兴趣点、信用评级、半值及五分之一值；购点使用3.7方案四的460点可选规则。
- filename: 克苏鲁的呼唤第七版规则书1907.pdf
  section: PDF页30–31职业列表；第四章PDF页47、53、58技能表及说明
  notes: 首批职业为图书馆管理员和教授；基础技能来自技能表，母语使用EDU，闪避使用DEX半值。技能专业当前列出拉丁语、摄影和部分科学专业。
- filename: 克苏鲁的呼唤第七版调查员手册1.20.pdf
  section: 第三章，PDF页34–35
  notes: 核对职业与背景创建边界；本批不启用有故事的调查员经历包。
- filename: 克苏鲁的呼唤第七版规则书1907.pdf
  section: PDF29–31、33–37、47–69
  notes: 第二十一批基础职业、技能与专业、背景、两年代信用资产；专业只在选择后分配。
- filename: 克苏鲁的呼唤第七版调查员手册1.20.pdf
  section: PDF40、49、53
  notes: 会计师、消防员、护士；有限目录，不代表全手册。
- filename: 克苏鲁的呼唤第七版调查员手册1.20.pdf
  section: PDF38–59（职业目录及全部职业数值块）
  notes: 第二十八批逐项覆盖见docs/occupation-coverage.md；同名职业更新沿用ID，特殊可选条款单列。
- filename: 克苏鲁的呼唤第七版规则书1907.pdf
  section: PDF29–31、48、59–60、63、68
  notes: 学术组允许不同专业；驾驶1、生存10、学问1；学问须KP引入，驾驶载具受年代限制。
- filename: 克苏鲁的呼唤第七版调查员手册1.20.pdf
  section: PDF46／印刷77–78；PDF53／印刷84–85；交叉核对PDF35／61–62及PDF136／223
  notes: 第三十批除魅师一项催眠替换须KP许可；神秘学家个人特长可含初始神话、10%为建议。职业条款未要求等额扣SAN，不能套用经历包相信者条款；初始SAN按规则书PDF25、51、131从POW推导并受99−神话限制。
notice: 本地规则核对1.3.0：115职业、106目录技能、6类自定义专业。除魅师催眠替换与神秘学家初始神话须KP许可；驾驶须核对载具年代，学问须KP引入且不代替神话。15–89岁，购点460；未分配技能点确认时放弃。
