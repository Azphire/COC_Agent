[project]
name = "coc-agent-backend"
version = "0.1.0"
description = "Local CoC 7 Agent with data-driven character creation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "openai>=3.9.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]
